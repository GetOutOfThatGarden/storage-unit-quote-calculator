<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bamboo Bob's Storage Calculator — Da Nang</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Bamboo Bob's Storage</h1>
            <p class="subtitle">Da Nang, Vietnam — Quote Request</p>
        </div>

        <form id="quote-form" action="https://formspree.io/f/mqkrvwzk" method="POST">
            <div class="section">
                <h2>Customer Details</h2>
                <div class="row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Storage Period</h2>
                <div class="row">
                    <div class="form-group">
                        <label for="date-in">Move-in Date</label>
                        <input type="date" id="date-in" name="date-in" required>
                    </div>
                    <div class="form-group">
                        <label for="date-out">Move-out Date</label>
                        <input type="date" id="date-out" name="date-out" required>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Services</h2>
                <div class="service-row automatic">
                    <div class="service-info">
                        <span class="service-name">Check-in Fee</span>
                        <span class="service-rate">50,000 ₫</span>
                    </div>
                </div>
                <div id="services-container"></div>
                <div class="service-row automatic">
                    <div class="service-info">
                        <span class="service-name">Check-out Fee</span>
                        <span class="service-rate">50,000 ₫</span>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Coupon</h2>
                <div class="form-group">
                    <input type="text" id="coupon" name="coupon" placeholder="Enter coupon code (e.g., Bob15)">
                </div>
            </div>

            <div class="section">
                <h2>Your Quote</h2>
                <div class="totals">
                    <div class="total-row"><span>Gross Invoice</span><span id="gross">0 ₫</span></div>
                    <div class="total-row discount"><span>Discount</span><span id="discount">-0 ₫</span></div>
                    <div class="total-row net"><span>Net Invoice</span><span id="net">0 ₫</span></div>
                    <div class="total-row"><span>Required Deposit</span><span>500,000 ₫</span></div>
                    <div class="total-row balance"><span>Balance at Pickup</span><span id="balance">0 ₫</span></div>
                </div>
            </div>
            
            <button type="submit" class="submit-btn">Request Quote</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
